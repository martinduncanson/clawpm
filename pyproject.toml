[project]
name = "clawpm"
version = "0.1.0"
description = "Filesystem-first multi-project manager for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "malphas", email = "malphas-gh@users.noreply.github.com" }]
keywords = ["cli", "project-management", "ai", "agents"]

dependencies = [
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "tomli>=2.0.0;python_version<'3.11'",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
]
# MCP stdio server (CLAWP-068). The `clawpm mcp` command degrades gracefully
# with a "pip install 'clawpm[mcp]'" hint when this extra isn't present.
# <2: mcp 2.x renamed FastMCP -> MCPServer and moved
# create_connected_server_and_client_session (CI caught this — team-lead
# diagnosis, confirmed against the actual CI failure log). Bump the floor
# alongside a real migration of mcp_server.py + test_mcp_server.py to the 2.x
# API, not by widening this bound alone.
mcp = [
    "mcp>=1.5.0,<2",
]
# Mirrors [dependency-groups].dev below so `pip install -e ".[dev]"` (CI, plain
# pip) works alongside `uv sync` (which reads the PEP 735 group). Keep in sync.
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "httpx>=0.24.0",
    "mcp>=1.5.0,<2",
]

[project.urls]
Homepage = "https://github.com/martinduncanson/clawpm"
Repository = "https://github.com/martinduncanson/clawpm"
Upstream = "https://github.com/malphas-gh/clawpm"

[project.scripts]
clawpm = "clawpm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clawpm"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "httpx>=0.24.0",
    "mcp>=1.5.0,<2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
